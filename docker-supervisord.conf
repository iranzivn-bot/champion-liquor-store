[supervisord]
nodaemon=true
pidfile=/run/supervisord.pid

[program:mysql]
command=/usr/sbin/mariadbd --user=mysql
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:apache]
command=/bin/bash -c "printf 'Listen %s\nServerName localhost\n' \"$PORT\" > /etc/apache2/ports.conf && exec apache2-foreground"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0