[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

; ---- First-boot DB bootstrap (temp server + app user + seed + migrations) --
; Holds /var/run/champion-store/bootstrap.lock while running. mariadbd waits on
; that lock; fast no-op on later boots (autorestart=false, runs once).
[program:bootstrap]
command=/bin/bash /var/www/html/docker-bootstrap.sh
priority=10
autostart=true
autorestart=false
startsecs=0
startretries=100
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

; ---- MariaDB (runs only after bootstrap releases the lock) ----------------
[program:mariadbd]
command=/bin/bash /var/www/html/docker-mariadb-wait.sh
priority=20
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

; ---- Apache (web port 0.0.0.0:$PORT) --------------------------------------
[program:apache]
command=/usr/sbin/apache2 -DFOREGROUND
priority=30
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0