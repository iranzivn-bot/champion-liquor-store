services:
  - type: web
    name: champion-liquor-store
    runtime: docker
    plan: free
    repo: https://github.com/iranzivn-bot/champion-liquor-store
    branch: master
    healthCheckPath: /healthz.php
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_PORT
        value: "3306"
      # Bundled MariaDB bootstrap + app credentials (single source of truth)
      - key: MYSQL_DATABASE
        value: champion_store
      - key: MYSQL_USER
        value: champion
      - key: MYSQL_PASSWORD
        generateValue: true