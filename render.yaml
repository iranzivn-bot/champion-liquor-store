services:
  # ─── Web service (PHP 8.3 + Apache) ───────────────────────────────────
  - type: web
    name: champion-liquor-store
    runtime: docker
    repo: https://github.com/iranzivn-bot/champion-liquor-store
    branch: master
    plan: starter
    healthCheckPath: /healthz.php
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SKIP_MIGRATIONS
        value: "0"
      # Database wiring — pulled from the private MySQL service below
      - key: DB_HOST
        fromService:
          type: pserv
          name: champion-liquor-store-mysql
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: champion-liquor-store-mysql
          property: port
      - key: DB_USER
        fromService:
          type: pserv
          name: champion-liquor-store-mysql
          envVarKey: MYSQL_USER
      - key: DB_NAME
        fromService:
          type: pserv
          name: champion-liquor-store-mysql
          envVarKey: MYSQL_DATABASE
      - key: DB_PASS
        fromService:
          type: pserv
          name: champion-liquor-store-mysql
          envVarKey: MYSQL_PASSWORD

  # ─── Private MySQL 8 service (Render template) ────────────────────────
  # Credentials live in the shared env group so the web service can reach them.
  - type: pserv
    name: champion-liquor-store-mysql
    runtime: docker
    repo: https://github.com/render-examples/mysql
    branch: master
    plan: basic-256mb
    envVars:
      - fromGroup: champion-liquor-store-mysql-group
    disk:
      name: champion-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 5

envVarGroups:
  - name: champion-liquor-store-mysql-group
    envVars:
      - key: MYSQL_DATABASE
        value: champion_store
      - key: MYSQL_USER
        value: champion
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true